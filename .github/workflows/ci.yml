name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile PHASE3/slice/*.py PHASE3/interface/*.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.8.4
      # Périmètre : l'interface (le code que la console exécute). Le moteur slice/
      # n'a jamais passé de ruff — 188 mécaniques — c'est un chantier à part.
      - run: ruff check PHASE3/interface/

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyYAML (seule dépendance tierce du cœur)
        run: pip install pyyaml==6.0.2
      - name: Bootstrap (0 réseau, 0 paquet — sourcing du code réel)
        run: bash PHASE3/test_bootstrap.sh
      - name: Contrat d'interface (console incluse)
        run: PYTHONPATH=PHASE3/slice python3 PHASE3/test_interface.py
      # test_securite.py et test_slice.py sont les batteries MACHINE DE RÉFÉRENCE :
      # elles exécutent le vrai sandbox bwrap et de vrais outils (semgrep/trivy/
      # gitleaks, installés par bootstrap.sh ~3,7 Go). Sur un runner éphémère ce
      # n'est pas reproductible — elles tournent sur la machine de référence via
      # doctor.py. Le dire vaut mieux qu'un rouge mal compris.
      # Épingle OPA : cf PHASE3/manifeste_dependances.yaml (opa 0.70.0, sha256
      # 00d114b94fdb1606a48cccdfc73c9ccdc62c38721150131ae578d5ff3df5c084).
      # Pas d'installation OPA en CI : aucune batterie CI ne l'exige (batteries
      # hors CI, pas de faux vert). Réinstaller OPA ici sans test consommateur
      # serait du vert décoratif.

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # F4/F5 : gitleaks épinglé (cf PHASE3/manifeste_dependances.yaml : 8.30.1,
      # sha256 88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509),
      # config forcée sur .gitleaks.toml. Échec = job rouge, jamais « audit ignoré ».
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gitleaks-version: 8.30.1
          config-path: .gitleaks.toml
