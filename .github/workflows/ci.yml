name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile PHASE3/slice/*.py PHASE3/interface/*.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.8.4
      # Périmètre : l'interface (le code que la console exécute). Le moteur slice/
      # n'a jamais passé de ruff — 188 mécaniques — c'est un chantier à part.
      - run: ruff check PHASE3/interface/

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyYAML (seule dépendance tierce du cœur)
        run: pip install pyyaml==6.0.2
      - name: Batteries du cœur (auto-contenues)
        run: PYTHONPATH=PHASE3/slice python3 PHASE3/test_slice.py
      - name: OPA épinglé (checksum publié vérifié) au chemin du pipeline
        run: |
          curl -fsSL -o opa https://openpolicyagent.org/downloads/v1.9.0/opa_linux_amd64_static
          curl -fsSL -o opa.sha256 https://openpolicyagent.org/downloads/v1.9.0/opa_linux_amd64_static.sha256
          echo "$(cat opa.sha256)  opa" | sha256sum -c -
          mkdir -p "$HOME/.cache/arena_secops/bin"
          chmod +x opa && mv opa "$HOME/.cache/arena_secops/bin/opa"
          "$HOME/.cache/arena_secops/bin/opa" version
          PYTHONPATH=PHASE3/slice python3 PHASE3/test_securite.py
      - name: Contrat d'interface (console incluse)
        run: PYTHONPATH=PHASE3/slice python3 PHASE3/test_interface.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
