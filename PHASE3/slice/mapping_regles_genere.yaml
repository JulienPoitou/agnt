source: metadata.technology des règles Semgrep
note: 'Fichier GÉNÉRÉ, ne pas éditer à la main. Le mapping règle → paquet est extrait
  des règles elles-mêmes : l''écrire à la main produisait une table d''une ligne et
  rendait la corrélation aveugle. metadata.packages est vide dans ces jeux de règles
