# Plugin AGNT — testssl.sh, audit de configuration TLS (vague web G4, 2026-09-05).
#
# 2026-09-05 (cible TLS d'épreuve, serveur.py --tls) : le chemin POSITIF est mesuré —
# code 0 sur https://127.0.0.1:8443/, 166 entrées, sévérités DÉCLARÉES relues telles
# quelles (cert_chain_of_trust CRITICAL sur auto-signé, TLS1_2/TLS1_3 OK, cert_commonName
# OK — qualif/testssl.sh/testssl_sh_https.json). Le REFUS NOMMÉ sur cible http:// reste
# mesuré et nommé : testssl.sh exige https:// ou hôte:port (code 254 + JSON d'état FATAL).
id: testssl_sh
capacites:
  - WEB_VULN_SCAN_ACTIVE
entrees:
  - url
binaire: testssl.sh
version_min: "3.2.4"
licence: GPL-2.0
priorite: 140
cout: faible
risque: ACTIVE
description: >
  Audit de configuration TLS (testssl.sh) : protocoles proposés (SSLv2…TLS 1.3), suites
  de chiffrement, certificats, renégociation, failles historiques (Heartbleed, ROBOT…).
  Audit de CONFIGURATION : une observation testssl.sh n'est pas en soi une vulnérabilité
  exploitée — la limite est portée par le manifeste, jamais gommée.
execution:
  args:
    # Ordre naturel du CLI (`testssl.sh [options] <URI>`) : les options AVANT la cible.
    # Mesuré : avec la cible en premier, le fatal d'usage (http://) survient AVANT
    # l'ouverture du --jsonfile et le JSON d'état n'est pas écrit ; options en premier,
    # il l'est (mesuré 2026-09-05) — le refus reste lisible dans l'artefact.
    - "--jsonfile"
    - "{OUT}"
    - "--color"
    - "0"
    - "--quiet"
    - "--warnings"
    - "off"
    - "{URL}"
  # 0 = scan rendu ; 254 = erreur d'usage (cible http:// refusée — mesuré) : échec nommé,
  # jamais un « rien trouvé ».
  code_succes: [0]
sortie:
  format: json
lecture:
  # --jsonfile écrit un TABLEAU JSON d'objets {id, ip, port, severity, finding}
  # (mesuré sur testssl.sh 3.2.4) : la racine EST la liste, d'où items_from "$".
  modele: plat
  items_from: "$"
  champs:
    regle: id
    nom_regle: id
    message: finding
    severite: severity
    url: ip
  masquer_large:
    - message
requirements:
  reseau: true
  privileges: aucun
  timeout_s: 600
a_verifier:
  - "MESURÉ SUR CIBLE TLS RÉELLE (2026-09-05, https://127.0.0.1:8443/, cert auto-signé
     CN=thaumas-web-epreuve) : code 0, 166 entrées ; sévérités DÉCLARÉES portées telles
     quelles (aucune traduction, aucune invention) — CRITICAL = cert_chain_of_trust
     (chaîne auto-signée non certifiée), OK = TLS1_2/TLS1_3/cert_commonName. WARN peut
     porter un état de scan (engine_problem) : relire l'id avant d'afficher."
  - "testssl.sh n'accepte pas http:// (exige https:// ou hôte:port) : sur une URL
     canonique http:// l'outil répond par l'erreur d'usage 254 et un JSON d'état (FATAL)
     — mesuré le 2026-09-05 contre THAUMAS-WEB. Sur une cible https, {URL} passe tel quel
     (la forme canonique avec / final est acceptée — mesuré)."
  - "le champ url est mappé sur ip : MESURÉ sur cible TLS réelle, ip = 127.0.0.1 (sans
     port ni schéma) — le constat reste hors de l'hôte engagé avec port côté oracle :
     non rejoué, raison nommée."
  - "le certificat auto-signé (CN, SAN IP:127.0.0.1/DNS:localhost) est porté par les ids
     cert_* du JSON (cert_commonName OK, cert_subjectAltName INFO) : rien n'est déduit
     au-delà de ce que l'outil déclare."
