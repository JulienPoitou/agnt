# Plugin AGNT — sslscan, sondage TLS rapide (vague web G4, 2026-09-05).
#
# 2026-09-05 (cible TLS d'épreuve, serveur.py --tls) : la surface POSITIVE est mesurée —
# TLS 1.2/1.3 offerts, 16 suites acceptées, 18 items (qualif/sslscan/sslscan_https.xml).
# Auparavant qualifié sur REFUS NOMMÉ (cible HTTP pur : URL refusée, sslscan n'accepte
# que hôte:port — le jeton {HOSTPORT}, résolu par le cœur, contourne ce refus SANS
# dénaturer la cible : c'est la même cible, nommée dans la forme que l'outil exige).
id: sslscan
capacites:
  - WEB_VULN_SCAN_ACTIVE
entrees:
  - url
binaire: sslscan
version_min: "2.1.5"
licence: GPL-3.0
priorite: 145
cout: faible
risque: ACTIVE
description: >
  Sondage TLS (sslscan) : protocoles négociables, suites de chiffrement offertes,
  renégociation, certificat. Lecture DÉCLARÉE de la surface TLS OFFERTE par le serveur :
  un protocole activé, une suite accepted/preferred, une renégociation insécurisée.
  Observations de configuration — sslscan ne porte aucune sévérité, jamais inventée.
execution:
  args:
    # Ordre mesuré : les options AVANT la cible (cible en premier → help + code 0,
    # usage ambigu — mesuré). La cible passe en forme hôte:port ({HOSTPORT}) : une URL
    # est refusée (« ERROR: Invalid target specified. », code 1 — mesuré).
    - "--xml=-"
    - "{HOSTPORT}"
  # sslscan rend son XML sur stdout (« - ») : l'artefact est stdout, comme git-dumper
  # (aucun fichier {OUT} — le repli stdout du cœur lit la même source).
  code_succes: [0]
sortie:
  format: custom
lecture:
  parser: sslscan
  champs:
    regle: regle
    nom_regle: nom_regle
    url: url
    message: message
    reference: reference
    preuve: preuve
  masquer_large:
    - preuve
requirements:
  reseau: true
  privileges: aucun
  timeout_s: 300
a_verifier:
  - "MESURÉ SUR CIBLE TLS RÉELLE (2026-09-05, https://127.0.0.1:8443, cert auto-signé
     CN=thaumas-web-epreuve) : code 0, TLS 1.2 + 1.3 enabled=1, 16 suites accepted,
     renégociation supported=0 (pas d'item — correct) → 18 items rendus par le parser.
     Le certificat reste dans l'artefact brut : le parser n'en extrait rien (convention
     sslyze/git-dumper — les données de la cible ne traversent pas le registre)."
  - "la forme {HOSTPORT} est résolue par le cœur (fournisseurs_web._hote_port) : le port
     par défaut du schéma y est RESTAURÉ (https://hote.tld/ → hote.tld:443)."
  - "binaire construit localement contre l'OpenSSL système (3.0.13) : protocoles legacy
     (SSLv2/SSLv3) et compression non testables — limite du build, consignée au
     manifeste."
