# Plugin AGNT — tlsx, recensement TLS (projectdiscovery) (vague web G4, 2026-09-05).
#
# Cible d'épreuve HTTP pur : tlsx ignore silencieusement une cible http:// (0 connexion,
# sortie vide, code 0 — mesuré). Le cœur nomme ce vide (« sortie vide : échec d'exécution,
# pas un scan propre ») : c'est le refus honnête, pas un scan sans constat.
id: tlsx
capacites:
  - WEB_VULN_SCAN_ACTIVE
entrees:
  - url
binaire: tlsx
version_min: "1.3.0"
licence: MIT
priorite: 150
cout: faible
risque: ACTIVE
description: >
  Recensement TLS (tlsx) : version TLS négociée, suite de chiffrement, certificat
  (émetteur, SAN, expiration) par hôte. Sortie JSONL — un objet par hôte. Recensement de
  surface : l'outil ne déclare pas de sévérité, elle reste absente, jamais inventée.
execution:
  args:
    - "-u"
    - "{URL}"
    - "-j"
    - "-o"
    - "{OUT}"
    - "-nc"
    - "-duc"
  code_succes: [0]
sortie:
  format: jsonl
lecture:
  modele: lignes_json
  champs:
    url: host
    regle: cipher_suite
    nom_regle: tls_version
    message: issuer_cn
    preuve: probe_status
requirements:
  reseau: true
  privileges: aucun
  timeout_s: 300
a_verifier:
  - "tlsx ignore silencieusement une cible http:// (0 connexion, fichiers vides, code 0 —
     mesuré le 2026-09-05 contre THAUMAS-WEB) : le cœur lit « sortie vide : échec
     d'exécution », le nommage correct de ce vide. La forme hôte:port nomme l'échec de
     négociation sur stderr — hors manifeste (aucun jeton hôte:port au cœur)."
  - "mapping dérivé des tags json du binaire épinglé (host, port, tls_version,
     cipher_suite, probe_status — extraits du binaire par strings) : non mesuré sur une
     cible TLS — aucune cible TLS autorisée dans cette qualification."
