  subject_cn (« thaumas-web-epreuve »), message ← issuer_cn (« thaumas-web-epreuve »),
  preuve ← cipher (« TLS_AES_256_GCM_SHA384 »). L'AUTO-SIGNATURE se lit par RAPPROCHEMENT
  dans l'artefact brut : subject_cn == issuer_cn (l'émetteur EST le sujet) et
  self_signed=true — rien n'est déduit au-delà. tlsx ne déclare pas de sévérité :
  absente, jamais inventée.
