# ATTENDUS — dalfox contre THAUMAS-WEB (http://127.0.0.1:8807, 2026-09-05)
cible: http://127.0.0.1:8807
resultat_attendu: >
  FAILLE TROUVÉE — T-XSS-001 prouvé. /search?q= réfléchit la requête SANS
  échappement (serveur.py) : dalfox 3.2.2 déclenche un payload vérifié sur le
  paramètre q (épreuve de calibration : type V, sévérité High DÉCLARÉE par
  l'outil, CWE-79 porté par l'outil, confiance high, DOM marker vérifié —
  ~168 requêtes). BORNES : un seul paramètre marqué, aucune wordlist externe,
  une seule cible 127.0.0.1.
code_retour: 1               # mesuré 3.2.2 : 1 = findings, 0 = propre, 2 = skippé
code_succes_plugin: [0, 1]
constats:
