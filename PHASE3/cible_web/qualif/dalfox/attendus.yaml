    type_attendu: V
    severite_declaree_outil: High
    cwe_outil: CWE-79
items_attendus: 1
echec_attendu: false
verification_honnete: >
  La sévérité High vient de la SORTIE de l'outil (champ severity du finding) —
  elle est portée telle quelle, jamais traduite ni choisie par la plateforme.
  La preuve est l'URL avec payload (champ data) et le payload lui-même, mesurés.
