  # est inerte : bootstrap.sh peut vérifier, le registre ne propose rien, et la policy refuse
  # de toute façon tout step ACTIVE tant que profil_sandbox.durci est faux.
  # Binaires extraits déposés dans ~/.cache/arena_secops/bin (WSL Ubuntu 24.04) et vérifiés
  # exécutables le 2026-09-01 : nuclei -version → v3.11.1 ; ffuf -V → 2.2.1.

