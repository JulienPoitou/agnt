    sha256: bdea4932c7fac7b56e8f74d53508799e2c9524b9579d788a774562bb0f2bf351
    source: bootstrap.sh (composant shellcheck)
    licence: GPL-3.0 (le wrapper suit le dépôt ; il appelle le binaire GPL-3.0)
    taille_approx: 1K
    role: outil
    note: >
      shellcheck ne scanne pas un répertoire (mesuré 2026-09-01 : rc=2). Le wrapper
      énumère *.sh/*.bash, concatène le JSON, valide la sortie avant rc=0 (rc=10 si
      non-JSON : jamais un « 0 constat » sur une sortie illisible).

