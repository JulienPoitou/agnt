  # Ces deux outils ne prennent PAS de répertoire (mesuré : shellcheck rc=2,
  # hadolint « Invalid option --recursive ») : bootstrap installe à leurs côtés un
  # wrapper de récursion VERSIONNÉ (contenu dans bootstrap.sh), épinglé ci-dessous
  # comme un binaire à part entière — il est exécuté, il a une empreinte.

  shellcheck:
    version: "0.11.0"
