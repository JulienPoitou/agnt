# Manifeste des dépendances externes — Phase 3.1
#
# POURQUOI CE FICHIER EXISTE
#   Les binaires et la base Trivy vivent hors du workspace (~/.cache/arena_secops) pour ne
#   pas exploser son budget. Mais un cache externe non vérifié n'est pas une reconstruction
#   reproductible : il peut contenir un binaire inattendu, ou une version différente de
#   celle qui a servi à valider les tests.
#
#   Ce manifeste rend la dépendance TRAÇABLE. Le bootstrap vérifie version et SHA-256, et
#   REFUSE un binaire inattendu au lieu de l'utiliser.
#
#   Sans ce fichier, l'affirmation « reconstruction depuis zéro » serait fausse.
#
# Les empreintes ci-dessous ont été relevées sur les binaires ayant servi à valider
# les suites de tests de Phase 3.1 (16/16, 10/10, 12/12, 22/22, 7+1, 10/10).

version: 1

binaires:
  trivy:
    version: "0.74.0"
    sha256: d89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791
    source: https://github.com/aquasecurity/trivy/releases
    licence: Apache-2.0
    taille_approx: 161M

  gitleaks:
    version: "8.30.1"
    sha256: 88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509
    source: https://github.com/gitleaks/gitleaks/releases
    licence: MIT
    taille_approx: 21M

  opa:
    version: "0.70.0"
    sha256: 00d114b94fdb1606a48cccdfc73c9ccdc62c38721150131ae578d5ff3df5c084
    # Audit du canal de distribution (même convention que grype/kics) : empreinte du
    # tarball npm `source` ci-dessus, mesurée au téléchargement le 2026-08-31. L'empreinte
    # du BINAIRE fait foi pour l'exécution ; celle de l'archive détecte un changement de canal.
    tarball_sha256: f2bb77a025ba9a16e80c107852f5c8ab424730eb1d2db3a8f94a9f531a0b886b
    source: https://registry.npmjs.org/agent-control-specification-opa-linux-x64/-/agent-control-specification-opa-linux-x64-0.3.1-beta.0.tgz
    licence: Apache-2.0
    taille_approx: 44M
    role: moteur
    # ───────────────────────────────────────────────────────────── RÉ-ÉPINGLAGE ÉCRIT
    # Remplace l'épingle précédente (1.20.0, openpolicyagent.org/downloads/latest).
    # Trois choses sont vraies en même temps, et aucune n'est arrangée :
    #
    #  1. LA VERSION N'EST PLUS CELLE QUI ÉTAIT DÉCLARÉE. 0.70.0 (31/10/2024) et non
    #     1.20.0. La déclarer, c'est laisser `sandbox.empreintes_conformes` faire son
    #     travail : sans ré-épinglage, la garde refuse l'exécution — ce qu'elle a fait,
    #     mesuré le 2026-08-30 (« empreinte divergente du manifeste épinglé »), preuve
    #     que F10 tient. La masquer en éditant le code de la garde aurait transformé un
    #     contrôle qui fonctionne en contrôle décoratif.
    #
    #  2. L'ORIGINE EST UN TIERS, PAS L'AMONT. `openpolicyagent.org` (000) et les assets
    #     de release GitHub (`objects.githubusercontent.com`, 000) sont injoignables
    #     depuis cette machine ; il n'existe aucun canal vers un binaire OPA publié par
    #     le projet OPA. Le paquet npm ci-dessus en est le seul vestige atteignable, et
    #     son binaire est « peuplé par scripts/fetch-opa.mjs au moment du publish » —
    #     c'est-à-dire récupéré par un script d'un tiers, à une date qu'on ne peut pas
    #     rejouer. C'est un saut d'approvisionnement que la règle 3 du chargeur de
    #     plugins interdit pour un OUTIL. Il est accepté ici pour le MOTEUR DE DÉCISION,
    #     en le disant, et avec les deux mesures ci-dessous.
    #
    #     CE QUI A ÉTÉ VÉRIFIÉ (mesuré, pas supposé) :
    #       · le binaire est un ELF x86-64 natif, 44 233 928 o, portant les chaînes
    #         `github.com/open-policy-agent/opa` ;
    #       · `opa version` rend Build Commit 2ea031ea04e6a8afbc5dd22f656131dc3cfc5a7d,
    #         commit qui EXISTE dans open-policy-agent/opa, d'Ashutosh Narkar (mainteneur
    #         OPA), daté 2024-10-30, message « Prepare v0.70.0 release » — cohérent avec
    #         le Build Timestamp 2024-10-31 du binaire ;
    #       · `policy.rego` s'évalue CORRECTEMENT dessus, aux quatre cas qui décident :
    #         allow, cible_non_autorisee, memoire_non_bornee_cible_non_fiable,
    #         commande_suspecte — mêmes motifs, même forme de sortie `-f raw`.
    #
    #     CE QUI N'A PAS PU ÊTRE VÉRIFIÉ, ET NE DOIT PAS ÊTRE LU COMME ACQUIS :
    #       · aucune comparaison à un checksum publié par le projet OPA pour la release
    #         0.70.0 (CDN injoignable). La provenance est CORROBORÉE par le commit de
    #         build, elle n'est pas prouvée cryptographiquement.
    #
    #  3. LA DÉCISION DE CONFIANCE NE REPOSE DONC PAS SUR LE BINAIRE. Elle repose sur
    #     `policy/policy.rego`, versionné dans ce dépôt, évalué par ce binaire et par
    #     aucun autre. Un binaire substitué qui rendrait une décision différente est
    #     détecté par le COMPORTEMENT, pas seulement par l'empreinte : c'est l'objet du
    #     cas de batterie ajouté à `test_qualite_plateforme.py` (les quatre cas ci-dessus
    #     rejoués sur le binaire réel). L'empreinte protège l'identité, le test protège
    #     la décision — les deux sont nécessaires, aucun ne remplace l'autre.
    #
    # Dès qu'un canal vers openpolicyagent.org ou vers les assets GitHub redevient
    # joignable : revenir à un binaire publié par le projet OPA, ré-épingler, relancer
    # la batterie, et SUPPRIMER ce bloc.

  bandit:
    package: bandit
    version: "1.9.4"
    source: https://pypi.org/project/bandit/
    licence: Apache-2.0
    distribution: pip
    distribution_hash: "9e7243122bf141ee55c31127efb175e0"
    verification: >
      Empreinte SHA-256 du fichier RECORD de la distribution installée. Ce n'est pas le
      SHA d'un binaire autonome — bandit est installé par pip, il n'y a pas de binaire
      unique à figer. Cette empreinte identifie le paquet Python réellement utilisé.
    note: >
      Deux providers l'utilisent : « bandit » (format json, niveau 1) et « bandit_custom »
      (format custom CSV, niveau 2). Si cette empreinte change, les deux doivent être
      re-testés.

  checkov:
    package: checkov
    version: "3.3.15"
    source: https://pypi.org/project/checkov/
    licence: Apache-2.0
    distribution: pip
    distribution_hash: "5173f1f56427ac03d61b8dc9465f7865e1ee35e076d77c58bf07bc5bfcba2f4f"
    verification: >
      Empreinte SHA-256 du fichier RECORD de la distribution installée (même principe
      que bandit — pas de binaire unique à figer). Ajouté le 2026-08-28 : provider
      IAC_SCAN niveau 1, vérifié avec et sans réseau sur PHASE3/testrepo_iac
      (38 findings identiques, aucune fuite du faux secret).

  grype:
    version: "0.118.0"
    # sha256 = empreinte du BINAIRE installé (vérifiée par verifier_binaire).
    sha256: 91705979c6ccb736b87e3250831f5e1a35f13767fd2032ffa85c55b1e6f58f90
    # Audit : empreinte du tarball de la release (mesurée au téléchargement).
    tarball_sha256: 6a9208e42c8c99a13011b4b98e6e2438990563043700036c732a829812c22c93
    source: https://github.com/anchore/grype/releases
    licence: Apache-2.0
    taille_approx: 90M
    note: >
      Ajouté le 2026-08-29 (étape 4) : 2e provider DEPENDENCY_ANALYSIS (fan-out
      trivy × grype). Base de vulnérabilités séparée, pré-téléchargée sous
      trivy-cache/grype (~2 Go, hors workspace).

  kics:
    version: "2.1.20"
    # sha256 = empreinte du BINAIRE installé. Faits du 2026-08-29 : le premier
    # téléchargement du tarball avait une taille anormale (96,9 Mo contre 30 Mo
    # pour l'asset officiel listé dans checksums.txt) ; la ré-extraction depuis
    # le tarball officiel vérifié a donné un binaire d'empreinte IDENTIQUE à
    # celle déjà épinglée. L'empreinte du binaire fait foi ; tarball_sha256 est
    # l'audit du canal de distribution.
    sha256: d3bb1923713df3fb8f96522a359801d7fe310b908cada541f627cc0e940eff39
    tarball_sha256: 8a5aa375ccfdc0ddd1114eddf1f9638ad7f6122e98d12a592207509dbe6d81f8
    # Bibliothèque de requêtes (1810 fichiers OPA) : asset officiel séparé.
    rules_asset: extracted-info.zip
    rules_asset_sha256: 305fd652d9291fb5f0a3437a4f0a2c953fffa7d2827bb4fd4907c82c1a8cbad9
    source: https://github.com/Checkmarx/kics/releases
    licence: Apache-2.0
    taille_approx: 97M
    note: >
      Ajouté le 2026-08-29 (étape 4) : 2e provider IAC_SCAN (fan-out checkov ×
      kics). ÉPINGLÉ SUR v2.1.20 : la release v2.1.21 a été publiée SANS
      binaires (0 assets, mesuré) — le harnais qualifie des artefacts, pas des
      annonces.

  # detect-secrets : premier outil ÉPINGLÉ à l'occasion d'une extension réelle (30/08/2026).
  # Régime volontairement celui de semgrep (note, pas de hash) plutôt que bandit : le
  # « hash RECORD » d'une distribution pip dépend du chemin d'installation, donc l'exiger
  # ferait refuser le bootstrap sur la machine du user alors qu'il passe ici. La
  # traçabilité est plus faible, elle est DITE plutôt que simulée.
  detect-secrets:
    package: detect-secrets
    version: "1.5.0"
    source: https://pypi.org/project/detect-secrets/
    licence: Apache-2.0
    distribution: pip
    sha256: null
    note: >
      Installé par pip, donc pas de binaire unique vérifiable par SHA-256. Version épinglée
      par bootstrap.sh. Mesuré ici avec `python3 -m detect_secrets scan --all-files` sur la
      fixture PHASE3/testrepo : 4 findings (AWS Access Key, Base64 High Entropy, Secret
      Keyword, GitHub Token), secrets rendus sous forme d'empreinte et non en clair.
  # 30/08/2026 — deux outils ajoutés par la voie PLUGIN (LOT 2) : aucune ligne touchée dans
  # capabilities.yaml, aucun code de provider écrit à la main. L'épingle reste la porte : un
  # plugin qui ne nomme pas une entrée d'ici est refusé au chargement.
  radon:
    package: radon
    version: "6.0.1"
    source: https://pypi.org/project/radon/
    licence: MIT
    distribution: pip
    sha256: null
    note: >
      Installé par pip, donc pas de binaire unique vérifiable par SHA-256 — régime « note »,
      comme detect-secrets. Mesuré ici (30/08/2026) sur PHASE3/testrepo :
      `python3 -m radon cc --json --min D testrepo` rend un objet JSON dont chaque clé est un
      chemin de fichier, hors réseau. Sortie de test : 0 bloc au seuil D sur la fixture (le
      provider rend donc « rien d'exploitable », et c'est un résultat, pas un échec).
    verification: >
      Le plugin declare `version_min: 6.0.1` : le format `cc --json` (clé = chemin de fichier)
      est celui lu ; une version inférieure change la structure et le plugin est refusé au
      chargement, pas ignoré à l'exécution.

  pip-audit:
    package: pip-audit
    version: "2.10.1"
    source: https://pypi.org/project/pip-audit/
    licence: Apache-2.0
    distribution: pip
    sha256: null
    note: >
      Installé par pip — régime « note ». Mesuré ici le 30/08/2026 hors sandbox :
      `python3 -m pip_audit -r testrepo/requirements.txt -f json` a rendu 70 vulnérabilités
      connues sur 6 paquets de la fixture (PYSEC + alias CVE, descriptions). L'outil CONSULT
      PyPI à chaque exécution : le plugin déclare donc `reseau: true`, et AGNT refusera de le
      lancer tant que l'autorisation d'export n'est pas accordée pour la mission. C'est
      l'état attendu, pas une panne — le refus doit être lisible dans le ledger.
    verification: >
      Formats réellement rendus par 2.10.1 : Columns, Json, CycloneDxJson, CycloneDxXml,
      Markdown. Pas de CSV : la documentation externe qui promet « -f csv » est fausse pour
      cette version (mesuré : `invalid OutputFormatChoice value: 'csv'`).


  semgrep:
    version: "1.175.0"
    sha256: null
    source: https://pypi.org/project/semgrep/
    distribution: pip
    licence: LGPL-2.1 (cœur)
    note: >
      Installé par pip, donc pas un binaire unique vérifiable par SHA-256 ici —
      même régime que bandit/checkov, mais SANS distribution_hash relevé : la
      traçabilité de ce tool est plus faible (version épinglée par le bootstrap
      seulement). À durcir (hash RECORD) si Semgrep devient un composant de
      production.

  ruff:
    package: ruff
    version: "0.16.5"
    source: https://pypi.org/project/ruff/
    licence: MIT
    distribution: pip
    # Binaire NATIF (le wheel pip de ruff embarque l'exécutable Rust) : contrairement à
    # radon/bandit, il y a bien un fichier unique à figer, donc un SHA-256 réel — régime le
    # plus fort des deux, relevé sur le binaire effectivement installé dans le pool.
    sha256: 024cdfbba8627539cc951908267077e3fd8e710add19f0b31d6cc606d19ddc32
    note: >
      Mesuré ici (31/08/2026), hors réseau : `ruff check --isolated --no-cache --select
      S,E,F --output-format json --quiet PHASE3/testrepo` rend 4 findings (S105 x2, S324,
      S602) en code 1 ; cible propre → `[]` en code 0. La cible qui écrit un `.ruff.toml`
      invalide fait échouer ruff SANS `--isolated` (rc=2, scan supprimé) et ne change rien
      AVEC : c'est la raison pour laquelle le drapeau est dans le plugin, pas une préférence.
    verification: >
      Le plugin déclare `version_min: 0.16.5` : `--output-format json` (tableau en racine,
      clés code/name/location/message/severity/url) est le format lu. `ruff check --format
      json` a été retiré par ruff : une version plus ancienne ne rendrait pas ce document.

  trufflehog3:
    package: trufflehog3
