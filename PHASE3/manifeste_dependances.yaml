    note: >
      Empreintes relevées le 2026-09-01 : SHA-256 de l'archive mesuré localement ET
      publié par l'API GitHub (assets[].digest) — les deux coïncident. `--version`
      mesuré sous WSL : version 0.11.0.

  shellcheck_scan:
