# Configuration ruff autonome : les clés sont RACINES ici (le préfixe [tool.ruff]
# n'existe que dans pyproject.toml — ruff 0.8 rejette le préfixe dans ce fichier).
target-version = "py312"
exclude = [
    "PHASE3/testrepo*",
    "PHASE3/artifacts",
    "archive",
]

[lint]
select = ["F", "E9", "I"]

[lint.per-file-ignores]
"PHASE3/interface/api.py" = ["F401", "I001"]  # imports tardifs volontaires (après sys.path)
